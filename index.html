<!DOCTYPE html>
<html lang="es-AR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Financifácil [$]</title>
</head>

<body class="min-h-screen bg-cover bg-fixed bg-no-repeat bg-center" style="background-image: url('assets/fondo.jpg');">
    <div class="contenedor opacity-80 max-w-5xl mx-auto p-4">
        <header
            class="border-4 border-double border-amber-700 bg-linear-to-b from-yellow-300 via-amber-400 to-amber-600 p-4 rounded-lg">
            <h1 class="text-3xl font-bold">Financifácil [$]</h1>
        </header>
        <h2
            class="border-4 border-double bg-linear-to-br from-lime-400 via-green-500 to-green-900 text-center text-xl font-bold p-3 my-4 rounded-lg">
            Controlá tus ingresos y gastos</h2>
        <section
            class="panel-balance flex flex-col gap-3 border-2 bg-linear-to-br from-yellow-500 via-yellow-100 to-yellow-400 p-4 rounded-lg">
            <div class="ingresos border-2 border-dashed p-3 rounded-md">
                <h3 class="font-bold">Ingresos Totales</h3>
                <p id="total-ingresos" class="text-green-600 font-bold text-xl"></p>
            </div>
            <div class="gastos border-2 border-dashed p-3 rounded-md">
                <h3 class="font-bold">Gastos Totales</h3>
                <p id="total-gastos" class="text-red-600 font-bold text-xl"></p>
            </div>
            <div class="balance border-2 border-dashed p-3 rounded-md">
                <h3 class="font-bold">Balance Neto</h3>
                <p id="balance-neto" class="font-bold text-xl"></p>
            </div>
        </section>
        <section
            class="formar-movimientos flex flex-col gap-3 border-2 bg-linear-to-br from-neutral-400 via-neutral-200 to-neutral-900 p-4 my-4 rounded-lg">
            <h2 class="text-xl font-bold">Nuevo movimiento</h2>
            <form id="formulario-movimientos" class="flex flex-col gap-3">
                <label for="descripcion" class="font-semibold">Descripción</label>
                <input type="text" name="descripcion" id="descripcion" placeholder="Descripción del movimiento" required
                    class="border-2 bg-linear-to-r from-indigo-400 via-white to-indigo-400 p-2 rounded-md">
                <label for="monto" class="font-semibold">Monto</label>
                <input type="number" name="monto" id="monto" placeholder="Monto" required min="0.01" step="0.01"
                    class="border-2 bg-linear-to-r from-gray-50 to-gray-500 p-2 rounded-md">
                <label for="tipo" class="font-semibold">Tipo</label>
                <select name="tipo" id="tipo" class="border-2 bg-linear-to-r from-green-400 to-red-400 p-2 rounded-md">
                    <option value="ingreso">Ingreso</option>
                    <option value="gasto">Gasto</option>
                </select>
                <label for="categoria" class="font-semibold">Categoría</label>
                <select name="categoria" id="categoria"
                    class="border-2 border-solid bg-linear-to-r from-sky-200 via-blue-100 to-cyan-200 p-2 rounded-md">
                    <option value="Sueldo">Sueldo</option>
                    <option value="Comida">Comida</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Otros">Otros</option>
                </select>
                <button type="submit"
                    class="border-2 border-black bg-blue-700 hover:bg-blue-800 text-white font-bold p-2 rounded-lg transition-colors">Registrar
                    movimiento</button>
            </form>
        </section>
        <section
            class="historial-movimientos flex flex-col items-center flex-wrap gap-3 border-2 bg-linear-to-br from-blue-700 via-sky-500 to-blue-700 p-4 rounded-lg">
            <h2 class="text-xl font-bold">Historial de movimientos</h2>
            <ul id="lista-movimientos" class="flex flex-col items-center gap-3 w-full"></ul>
        </section>
        <section id="resumen-texto"
            class="flex flex-col flex-wrap gap-3 border-4 border-double bg-linear-to-b from-yellow-400 to-gray-100 p-4 my-4 rounded-lg items-center">
            <h2 class="text-xl font-bold">Resumen por Categorías</h2>
        </section>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
