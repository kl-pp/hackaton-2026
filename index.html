<!DOCTYPE html>
<html lang="es-AR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financifácil [$]</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contenedor">
        <header>
            <h1>Financifácil [$]</h1>
        </header>
        <h2 class="subtitulo">Controlá tus ingresos y gastos</h2>
        <section class="panel-balance">
            <div class="ingresos">
                <h3>Ingresos Totales</h3>
                <p id="total-ingresos"></p>
            </div>
            <div class="gastos">
                <h3>Gastos Totales</h3>
                <p id="total-gastos"></p>
            </div>
            <div class="balance">
                <h3>Balance Neto</h3>
                <p id="balance-neto"></p>
            </div>
        </section>
        <section class="formar-movimientos">
            <h2>Nuevo movimiento</h2>
            <form id="formulario-movimientos">
                <label for="descripcion">Descripción</label>
                <input type="text" name="descripcion" id="descripcion" placeholder="Descripción del movimiento"
                    required>
                <label for="monto">Monto</label>
                <input type="number" name="monto" id="monto" placeholder="Monto" required min="0.01" step="0.01">
                <label for="tipo">Tipo</label>
                <select name="tipo" id="tipo">
                    <option value="ingreso">Ingreso</option>
                    <option value="gasto">Gasto</option>
                </select>
                <label for="categoria">Categoría</label>
                <select name="categoria" id="categoria">
                    <option value="Sueldo">Sueldo</option>
                    <option value="Comida">Comida</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Otros">Otros</option>
                </select>
                <button type="submit">Registrar movimiento</button>
            </form>
        </section>
        <section class="historial-movimientos">
            <h2>Historial de movimientos</h2>
            <ul id="lista-movimientos"></ul>
        </section>
        <section id="resumen-texto">
            <h2>Resumen por Categorías</h2>
        </section>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
